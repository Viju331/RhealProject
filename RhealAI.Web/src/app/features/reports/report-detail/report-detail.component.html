<div class="report-page" *ngIf="!isLoading && report && htmlContent; else loading">
    <div class="container">
        <!-- Page Header with Actions -->
        <div class="page-header-section">
            <div>
                <h1 class="page-header">📊 Analysis Report</h1>
                <p class="page-subtitle">Generated on {{ report.generatedAt | date:'medium' }} | {{
                    report.repositoryName }}</p>
            </div>
            <div class="header-actions">
                <button mat-raised-button (click)="exportReport('json')">
                    <mat-icon>code</mat-icon>
                    Export JSON
                </button>
                <button mat-raised-button (click)="exportReport('pdf')">
                    <mat-icon>picture_as_pdf</mat-icon>
                    Export PDF
                </button>
                <button mat-raised-button color="primary" (click)="exportReport('html')">
                    <mat-icon>download</mat-icon>
                    Download HTML Report
                </button>
            </div>
        </div>

        <!-- HTML Report Display -->
        <div class="html-report-container glass-card">
            <div class="report-content" [innerHTML]="htmlContent"></div>
        </div>
    </div>
</div>

<ng-template #loading>
    <app-loading-spinner message="Loading report..."></app-loading-spinner>
</ng-template>
